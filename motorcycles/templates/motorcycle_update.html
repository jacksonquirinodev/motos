{% extends "base.html" %}

{% block content %}

  <style>
    form {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    form h1 {
      color: #f0f0f0;
      font-size: 2rem;
      margin-bottom: 20px;
      text-align: center;
    }

    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }

    th, td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    th {
      background-color: #252525;
      color: #e0e0e0;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    select,
    textarea {
      box-sizing: border-box;
      padding: 8px;
      font-size: 14px;
      color: #e0e0e0;
      background-color: #121212;
      border: 2px solid #444;
      border-radius: 4px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 8px;
      transition: border-color 0.3s ease-in-out;
    }

    input[type="file"] {
      max-width: 100%;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="file"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #a52a2a;
    }

    input[type="checkbox"] {
      accent-color: #8b1e1e;
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background-color: #8b1e1e;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease-in-out;
    }

    .btn:hover {
      background-color: #b52b2b;
    }

    .btn-danger {
      background-color: #8b1e1e;
      text-decoration: none !important;
    }

    .btn-danger:hover {
      background-color: #b52b2b;
    }

    .error-message {
      color: #e57373;
      font-size: 14px;
      margin-top: 5px;
    }

    a {
      text-decoration: none !important;
    }

    @media (max-width: 600px) {
      form {
        margin: 15px;
        padding: 15px;
      }

      form h1 {
        font-size: 1.5rem;
      }

      table {
        font-size: 14px;
      }

      th, td {
        padding: 6px 4px;
      }
    }
  </style>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <h1>Editar Moto</h1>

    <table>
      {{ form.as_table }}
    </table>
    <div>
        <div class="buttons-container">
            <input type="submit" value="Salvar Alterações" class="btn btn-primary">
            <a href="{% url 'motorcycle_delete' pk=object.pk %}" class="btn btn-danger">Deletar moto</a>
            <a href="{% url 'motorcycles_list' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </div>
  </form>

{% endblock %}
